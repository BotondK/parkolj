name: Szerver (API) tesztek

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/logic/**', 'src/data/**', 'src/types.ts', '.github/workflows/server.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
