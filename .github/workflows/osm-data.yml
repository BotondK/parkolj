name: OSM adatok letöltése (garázsok, P+R, töltők)

# Kézzel indítható. Az eredmény az `osm-data` ágra kerül (és csatolmányként is letölthető);
# a main ágra átnézés után kerül be: git checkout origin/osm-data -- src/data/osm public/data
on:
  workflow_dispatch:
    inputs:
      probe_zones:
        description: 'Parkolási zóna adatok felmérése az OSM-ben (csak napló)'
        type: boolean
        default: false

permissions:
  contents: write # csak az osm-data ágra ír

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-osm.mjs
        env:
          PROBE_ZONES: ${{ inputs.probe_zones && '1' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: osm-data
          path: |
            src/data/osm/
            public/data/zone-streets.json
      - name: Eredmény az osm-data ágra
        run: |
          git config user.name "parkolj-osm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B osm-data
          git add -f src/data/osm public/data/zone-streets.json
          git commit -m "OSM adatok $(date -u +%F)" || exit 0
          git push -f origin osm-data
