name: Webes demó (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          TZ: Europe/Budapest
      - run: npx expo export -p web
        env:
          # Repo → Settings → Secrets and variables → Actions → Variables → API_URL (üresen: nincs szerverszinkron)
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Végigkattintós tesztek a kész buildre: ha elbuknak, nem kerül ki az új verzió
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'
      # SPA: ismeretlen útvonalon is az app töltődjön be
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
