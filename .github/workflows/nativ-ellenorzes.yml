name: Natív fordítás (ellenőrzés)

# Lefordítja az Android és az iPhone appot a widgetekkel együtt (aláírás nélkül), hogy a telefonos build
# ne az Expo felhőjében bukjon el először. Csak akkor fut, ha natív részt érintő fájl változik, vagy kézzel.
on:
  push:
    branches: [main]
    paths:
      - 'targets/**'
      - 'src/widgets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'index.ts'
      - '.github/workflows/nativ-ellenorzes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativ-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - name: Fordítás (debug APK)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: A widgetek benne vannak az appban
        run: |
          grep -q 'widget.ParkolasWidget' android/app/src/main/AndroidManifest.xml
          grep -q 'widget.GyorsWidget' android/app/src/main/AndroidManifest.xml

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Legújabb Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: npx expo prebuild -p ios
      - name: Fordítás szimulátorra, aláírás nélkül (app + widget)
        run: |
          xcodebuild -workspace ios/Parkolj.xcworkspace -scheme Parkolj -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              echo '--- hibák ---'; grep -n 'error:' build.log | head -60
              echo '--- a hibás lépés vége ---'; grep -n -B40 'Command PhaseScriptExecution failed' build.log | grep -v '^[0-9]*-    export ' | tail -60
              tail -n 30 build.log; exit 1; }
          tail -n 5 build.log
      - name: A widget lefordult
        run: find ~/Library/Developer/Xcode/DerivedData -name 'ParkoljWidget.appex' -type d | grep -q .
