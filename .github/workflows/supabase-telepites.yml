name: Supabase telepítés

# Egy gombnyomásra élesíti a Supabase-oldali részeket, hogy ne kelljen kézzel SQL-t futtatni:
#  1. lefuttatja a supabase/schema.sql-t (újrafuttatható, a meglévő adatot nem törli),
#  2. ha még nincs, létrehozza a Web Push (VAPID) kulcspárt a Supabase titkai közé,
#  3. telepíti a push-send függvényt (lejárati értesítés a bezárt webappnak),
#  4. beállítja, hogy a küldő percenként fusson (pg_cron + pg_net),
#  5. ellenőrzi az eredményt.
# Kell hozzá: a repo Secrets között SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Részletek: docs/FIOK.md
# Csak kézzel indul (Actions → Supabase telepítés → Run workflow), mert élesben változtat.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-telepites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_URL: ${{ vars.SUPABASE_URL }}
      KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Projekt azonosító
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Hiányzik a SUPABASE_ACCESS_TOKEN secret (lásd docs/FIOK.md)"; exit 1; fi
          # Ugyanaz az elnéző beolvasás, mint az appban (src/logic/cloud.ts → normalizeSupabaseUrl)
          U=$(node -e '
            let s = (process.env.RAW_URL || "").trim().replace(/^["\x27]|["\x27]$/g, "");
            const d = /supabase\.com\/dashboard\/project\/([a-z0-9]+)/i.exec(s);
            if (d) s = "https://" + d[1].toLowerCase() + ".supabase.co";
            else if (/^[a-z0-9]{15,30}$/i.test(s)) s = "https://" + s.toLowerCase() + ".supabase.co";
            else if (!/^https?:\/\//i.test(s)) s = "https://" + s;
            console.log(s.replace(/\/+$/, "").replace(/\/(rest|auth)\/v1$/, ""));
          ')
          REF=$(echo "$U" | sed -E 's#https?://([a-z0-9]+)\.supabase\.co.*#\1#')
          if ! echo "$REF" | grep -Eq '^[a-z0-9]{15,30}$'; then echo "::error::Nem értelmezhető a SUPABASE_URL változó"; exit 1; fi
          echo "U=$U" >> "$GITHUB_ENV"
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: 1. Adatbázis (schema.sql)
        run: |
          sql() { # SQL futtatása a Management API-n át; hiba esetén kiírja és leáll
            code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$(jq -Rs '{query: .}' "$1")")
            if [ "${code:0:1}" != "2" ]; then echo "::error::$2: $code $(head -c 500 /tmp/r)"; exit 1; fi
            echo "OK   $2"
          }
          sql supabase/schema.sql "schema.sql lefutott"

      - name: 2. Web Push kulcsok
        run: |
          names=$(curl -sf "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[].name')
          if echo "$names" | grep -qx VAPID_PRIVATE_KEY && echo "$names" | grep -qx VAPID_PUBLIC_KEY; then
            echo "OK   a kulcsok már megvannak (nem cseréljük, különben a meglévő feliratkozások elvesznének)"
          else
            eval "$(node scripts/vapid-keys.mjs)"
            echo "::add-mask::$PRIVATE"
            body=$(jq -n --arg pub "$PUBLIC" --arg priv "$PRIVATE" '[{name:"VAPID_PUBLIC_KEY",value:$pub},{name:"VAPID_PRIVATE_KEY",value:$priv}]')
            curl -sf -X POST "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$body" > /dev/null
            echo "OK   új kulcspár a Supabase titkai között"
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 3. push-send függvény telepítése
        # --no-verify-jwt: a percenkénti ütemező kulcs nélkül hívja; a függvény csak az esedékes értesítéseket küldi ki
        run: supabase functions deploy push-send --project-ref "$REF" --no-verify-jwt --use-api

      - name: 4. Percenkénti küldés (pg_cron)
        run: |
          cat > /tmp/cron.sql <<SQL
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          select cron.unschedule(jobid) from cron.job where jobname = 'parkolj-push';
          select cron.schedule('parkolj-push', '* * * * *',
            \$\$ select net.http_post(url := '$U/functions/v1/push-send', body := '{}'::jsonb, headers := '{"Content-Type":"application/json"}'::jsonb) \$\$);
          SQL
          code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$(jq -Rs '{query: .}' /tmp/cron.sql)")
          if [ "${code:0:1}" != "2" ]; then echo "::error::pg_cron beállítás: $code $(head -c 500 /tmp/r)"; exit 1; fi
          echo "OK   a küldő percenként fut"

      - name: 5. Ellenőrzés
        run: |
          AUTH=(); case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY");; esac
          req() { curl -s -o /tmp/b -w '%{http_code}' -H "apikey: $KEY" "${AUTH[@]}" -H 'Content-Type: application/json' "$@"; }
          fail=0
          check() { if echo "$3" | grep -Eq "^($2)$"; then echo "OK   $1 ($3)"; else echo "HIBA $1: $3 $(head -c 200 /tmp/b)"; fail=1; fi; }
          check "push-send ad nyilvános kulcsot" '200' "$(req "$U/functions/v1/push-send")"
          jq -e '.publicKey | length == 87' /tmp/b > /dev/null || { echo "HIBA: nincs érvényes kulcs a válaszban"; fail=1; }
          check "push-send POST (esedékesek kiküldése)" '200' "$(req -X POST "$U/functions/v1/push-send" -d '{}')"
          check "push_schedule (túl sok időpontot elutasít)" '400' "$(req -X POST "$U/rest/v1/rpc/push_schedule" -d '{"p_token":"00000000-0000-4000-8000-000000000000","p_endpoint":"https://x","p_p256dh":"x","p_auth":"x","p_jobs":[{},{},{},{},{}]}')"
          check "push_jobs kívülről nem olvasható" '401|403' "$(req "$U/rest/v1/push_jobs?limit=1")"
          check "push_take_due kívülről nem hívható" '401|403|404' "$(req -X POST "$U/rest/v1/rpc/push_take_due" -d '{}')"
          check "app_errors tábla (hibás sort elutasít)" '400' "$(req -X POST "$U/rest/v1/app_errors" -d '{"kind":"x"}')"
          check "spot_reports tábla (hibás sort elutasít)" '400' "$(req -X POST "$U/rest/v1/spot_reports" -d '{"kind":"x"}')"
          check "nospace_hotspots függvény" '200' "$(req -X POST "$U/rest/v1/rpc/nospace_hotspots" -d '{}')"
          check "search_time_stats függvény" '200' "$(req -X POST "$U/rest/v1/rpc/search_time_stats" -d '{}')"
          exit $fail
