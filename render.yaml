# Render Blueprint: a Parkolj API ingyenes csomagon. Lásd docs/HOSZTOLAS.md
services:
  - type: web
    name: parkolj-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://botondk.github.io
